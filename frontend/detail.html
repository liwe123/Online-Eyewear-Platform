<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼镜详情 - 丹智慧眼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-glasses me-2"></i>
                丹智慧眼
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#features">平台特色</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#ai-analysis">AI分析</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#shop">眼镜商城</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">关于我们</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light me-2" id="auth-btn">
                        <i class="fas fa-user me-1"></i> 登录
                    </button>
                    <button class="btn btn-light position-relative" id="cart-btn">
                        <i class="fas fa-shopping-cart me-1"></i> 购物车
                        <span class="badge rounded-pill bg-danger cart-badge" id="cart-badge">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="detail-container">
        <a href="index.html#shop" class="btn btn-secondary mb-3">← 返回商城</a>
        <div class="detail-card">
            <div class="card-body">
                <div class="row">
                    <!-- 眼镜图片 -->
                    <div class="col-md-4">
                        <img id="glassesImage" src="" alt="眼镜图片" class="img-fluid rounded shadow">
                    </div>
                    <!-- 眼镜详情 -->
                    <div class="col-md-8">
                        <h3 id="glassesTitle" class="mb-4"></h3>
                        <table class="table table-borderless mt-4">
                            <tr>
                                <td class="fw-bold">镜框形状</td>
                                <td id="frameShape"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜框尺寸</td>
                                <td id="frameSize"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜框材质</td>
                                <td id="frameMaterial"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜片适用度数</td>
                                <td id="lensDegree"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜片折射率</td>
                                <td id="lensRefractiveIndex"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">价格</td>
                                <td id="price" class="text-danger fw-bold"></td>
                            </tr>
                        </table>
                        <button class="btn btn-primary mt-3" id="add-cart-btn">
                            <i class="fas fa-shopping-cart me-1"></i> 加入购物车
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const titleEl = document.getElementById('glassesTitle');
            const imgEl = document.getElementById('glassesImage');
            const frameShapeEl = document.getElementById('frameShape');
            const frameSizeEl = document.getElementById('frameSize');
            const frameMaterialEl = document.getElementById('frameMaterial');
            const lensDegreeEl = document.getElementById('lensDegree');
            const lensRefractiveIndexEl = document.getElementById('lensRefractiveIndex');
            const priceEl = document.getElementById('price');
            const addCartBtn = document.getElementById('add-cart-btn');

            if (!titleEl || !imgEl || !frameShapeEl || !frameSizeEl || !frameMaterialEl || !lensDegreeEl || !lensRefractiveIndexEl || !priceEl || !addCartBtn) {
                showToast('详情页初始化失败，页面结构不完整', 'danger');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const glassesId = urlParams.get('glasses_id');

            if (!glassesId) {
                showToast('缺少眼镜ID参数，正在返回首页', 'warning');
                setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                return;
            }

            let currentGlasses = null;

            // 加载眼镜详情（可被“重试”按钮再次调用）
            function loadGlassesDetail() {
                titleEl.textContent = '加载中...';

                apiRequest(`${API_BASE}/api/glasses/detail?glasses_id=${encodeURIComponent(glassesId)}`)
                    .then(result => {
                        // 仅 404（商品不存在）跳回首页；网络/其他错误走下方 catch 显示重试
                        if (result.code === 404) {
                            showToast('未找到该眼镜，正在返回首页', 'warning');
                            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                            return;
                        }
                        if (result.code !== 200) {
                            throw new Error(result.msg || '获取详情失败');
                        }
                        const data = result.data || {};
                        currentGlasses = data;

                        const titleText = data.name
                            ? ((data.brand ? data.brand + ' · ' : '') + data.name)
                            : (data.frame_shape + ' 眼镜 (ID: ' + data.glasses_id + ')');
                        titleEl.textContent = titleText;
                        imgEl.src = resolveImageUrl(data.image_url);
                        setImgFallback(imgEl);
                        frameShapeEl.textContent = data.frame_shape || '-';
                        frameSizeEl.textContent = data.frame_size || '-';
                        frameMaterialEl.textContent = data.frame_material || '-';
                        lensDegreeEl.textContent = `${data.lens_degree_min ?? '-'}至${data.lens_degree_max ?? '-'}度`;
                        lensRefractiveIndexEl.textContent = data.lens_refractive_index ?? '-';
                        priceEl.textContent = `¥${Number(data.price || 0).toFixed(2)}`;
                    })
                    .catch(error => {
                        console.error('获取详情失败：', error);
                        titleEl.textContent = '加载失败';
                        showToast('获取详情失败：' + (error.message || '网络错误') + '，请检查网络后重试', 'danger');

                        // 网络/其他错误：显示错误信息与重试按钮，而不是跳回首页
                        const oldBox = document.getElementById('detail-error-box');
                        if (oldBox) oldBox.remove();
                        const box = document.createElement('div');
                        box.id = 'detail-error-box';
                        box.className = 'text-danger mt-3';
                        box.textContent = '商品信息加载失败，请检查网络后重试。';
                        const retryBtn = document.createElement('button');
                        retryBtn.type = 'button';
                        retryBtn.className = 'btn btn-outline-primary btn-sm mt-2';
                        retryBtn.textContent = '重试';
                        retryBtn.addEventListener('click', function () {
                            const eb = document.getElementById('detail-error-box');
                            if (eb) eb.remove();
                            loadGlassesDetail();
                        });
                        box.appendChild(retryBtn);
                        addCartBtn.insertAdjacentElement('afterend', box);
                    });
            }

            loadGlassesDetail();

            addCartBtn.addEventListener('click', function () {
                if (!currentGlasses) {
                    showToast('商品信息尚未加载完成', 'warning');
                    return;
                }
                addToCart(currentGlasses);
                // 短暂给出“已添加”反馈
                const originalHtml = addCartBtn.innerHTML;
                addCartBtn.innerHTML = '<i class="fas fa-check me-1"></i> 已添加';
                addCartBtn.disabled = true;
                setTimeout(function () {
                    addCartBtn.disabled = false;
                    addCartBtn.innerHTML = originalHtml;
                }, 1200);
            });
        });
    </script>
</body>
</html>
