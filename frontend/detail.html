<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>眼镜详情 - 丹智慧眼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-glasses me-2"></i>
                丹智慧眼
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#features">平台特色</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#ai-try-on">AI试戴</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#shop">眼镜商城</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">关于我们</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <button class="btn btn-outline-light me-2" id="auth-btn">
                        <i class="fas fa-user me-1"></i> 登录
                    </button>
                    <button class="btn btn-light position-relative" id="cart-btn">
                        <i class="fas fa-shopping-cart me-1"></i> 购物车
                        <span class="badge rounded-pill bg-danger cart-badge" id="cart-badge">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="detail-container">
        <a href="index.html#shop" class="btn btn-secondary mb-3">← 返回商城</a>
        <div class="detail-card">
            <div class="card-body">
                <div class="row">
                    <!-- 眼镜图片 -->
                    <div class="col-md-4">
                        <img id="glassesImage" src="" alt="眼镜图片" class="img-fluid rounded shadow">
                    </div>
                    <!-- 眼镜详情 -->
                    <div class="col-md-8">
                        <h3 id="glassesTitle" class="mb-4"></h3>
                        <table class="table table-borderless mt-4">
                            <tr>
                                <td class="fw-bold">镜框形状</td>
                                <td id="frameShape"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜框尺寸</td>
                                <td id="frameSize"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜框材质</td>
                                <td id="frameMaterial"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜片适用度数</td>
                                <td id="lensDegree"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">镜片折射率</td>
                                <td id="lensRefractiveIndex"></td>
                            </tr>
                            <tr>
                                <td class="fw-bold">价格</td>
                                <td id="price" class="text-danger fw-bold"></td>
                            </tr>
                        </table>
                        <button class="btn btn-primary mt-3" id="add-cart-btn">
                            <i class="fas fa-shopping-cart me-1"></i> 加入购物车
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script>
        // 从URL获取眼镜ID（如：detail.html?glasses_id=G001）
        const urlParams = new URLSearchParams(window.location.search);
        const glassesId = urlParams.get("glasses_id");

        // 如果没有眼镜ID，返回首页
        if (!glassesId) {
            alert("缺少眼镜ID参数");
            window.location.href = "index.html";
        }

        // 当前商品数据（供加入购物车使用）
        let currentGlasses = null;

        // 调用后端接口获取详情
        apiRequest(`${API_BASE}/api/glasses/detail?glasses_id=${encodeURIComponent(glassesId)}`)
            .then(result => {
                if (result.code !== 200) {
                    throw new Error(result.msg || '获取详情失败');
                }
                const data = result.data;
                currentGlasses = data;

                // 填充页面数据
                document.getElementById("glassesTitle").textContent = `${data.frame_shape} 眼镜 (ID: ${data.glasses_id})`;
                const img = document.getElementById("glassesImage");
                img.src = resolveImageUrl(data.image_url);
                setImgFallback(img); // 内联 SVG 回退，不依赖外链
                document.getElementById("frameShape").textContent = data.frame_shape;
                document.getElementById("frameSize").textContent = data.frame_size;
                document.getElementById("frameMaterial").textContent = data.frame_material;
                document.getElementById("lensDegree").textContent = `${data.lens_degree_min}至${data.lens_degree_max}度`;
                document.getElementById("lensRefractiveIndex").textContent = data.lens_refractive_index;
                document.getElementById("price").textContent = `¥${Number(data.price).toFixed(2)}`;
            })
            .catch(error => {
                console.error("获取详情失败：", error);
                showToast("获取详情失败：" + error.message, "danger");
                setTimeout(() => { window.location.href = "index.html"; }, 1500);
            });

        // 加入购物车
        document.getElementById("add-cart-btn").addEventListener("click", function () {
            if (!currentGlasses) {
                showToast("商品信息尚未加载完成", "warning");
                return;
            }
            addToCart(currentGlasses);
        });
    </script>
</body>
</html>
