# 丹智慧眼 - Nginx 反向代理配置
# Docker 部署：由 Dockerfile.frontend 复制到 /etc/nginx/conf.d/default.conf
#   （server 片段，被主配置 include 进 http{}，随主配置一起加载）
# 手动部署：放入 /etc/nginx/conf.d/dzhy.conf 或 sites-available，nginx -t 后 reload
#
# 说明：
# - limit_req_zone 只能出现在 http 上下文；本文件被 include 进 http{}，故放在文件顶部。
# - 容器内上游用服务名 backend/model；手动部署在本机时请改回 http://localhost:5000 / :8000。
# - 静态根目录在容器内为 /usr/share/nginx/html；手动部署时改回实际路径（如 /var/www/dzhy/frontend）。

# 限流：按客户端 IP，10 r/s，突发 20
limit_req_zone $binary_remote_addr zone=dzhy_api:10m rate=10r/s;

server {
    listen 80;
    server_name _;  # 替换为实际域名

    # 静态前端根目录（容器内路径）
    root /usr/share/nginx/html;
    index index.html;

    # 上传限制（人脸图片上传）
    client_max_body_size 12m;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # 前端依赖 CDN：Bootstrap(cdn.jsdelivr.net)、FontAwesome(cdnjs.cloudflare.com)、Unsplash 图片；
    # 图片/接口直连后端 :5000，故在 img-src/connect-src 中放行 localhost:5000。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://images.unsplash.com http://localhost:5000 http://127.0.0.1:5000; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000; object-src 'none'; base-uri 'none'; frame-ancestors 'none';" always;

    # Flask 后端 API（保留 /api 前缀转发）
    location /api/ {
        limit_req zone=dzhy_api burst=20 nodelay;
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 模型服务（rewrite 去掉 /model 前缀）
    location /model/ {
        limit_req zone=dzhy_api burst=20 nodelay;
        rewrite ^/model/(.*)$ /$1 break;
        proxy_pass http://model:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 模型推理耗时较长，放宽超时
        proxy_read_timeout 120s;
    }

    # 商品图片（由 backend 的 /static/glasses/ 提供）
    location /static/glasses/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

