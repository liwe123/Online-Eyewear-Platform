# 丹智慧眼 - Nginx 反向代理配置（手动部署参考）
# 部署前提：backend(5000) 与 model(8000) 运行在本机，frontend/ 为静态目录
# 用法：放入 /etc/nginx/conf.d/dzhy.conf 或 sites-available，nginx -t 后 reload

server {
    listen 80;
    server_name _;  # 替换为实际域名

    # 静态前端根目录（替换为实际路径，如 /var/www/dzhy/frontend）
    root /var/www/dzhy/frontend;
    index index.html;

    # 上传限制（人脸图片上传）
    client_max_body_size 12m;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Flask 后端 API（保留 /api 前缀转发）
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI 模型服务（rewrite 去掉 /model 前缀）
    location /model/ {
        rewrite ^/model/(.*)$ /$1 break;
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 模型推理耗时较长，放宽超时
        proxy_read_timeout 120s;
    }

    # 商品图片（由 backend 的 /static/glasses/ 提供）
    location /static/glasses/ {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

