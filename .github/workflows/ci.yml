name: CI

on:
  push:
    branches: [master, main]
    # 仅改动基础设施文件时跳过 CI（依赖较重：torch/mediapipe 安装耗时）。
    # pip 缓存由 actions/setup-python 的 cache: pip 提供，见下方 test 步骤。
    paths-ignore:
      - "Dockerfile*"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/**"
      - "*.bat"
      - ".gitignore"
      - ".dockerignore"
      - "requirements*.txt"
      - "backend/requirements.txt"
      - ".env.example"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "Dockerfile*"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/**"
      - "*.bat"
      - ".gitignore"
      - ".dockerignore"
      - "requirements*.txt"
      - "backend/requirements.txt"
      - ".env.example"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f Dockerfile.backend -t dzhy-backend .

      - name: Build model image
        run: docker build -f Dockerfile.model -t dzhy-model .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t dzhy-frontend .
